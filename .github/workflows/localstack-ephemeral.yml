# Apply efêmero no LocalStack do runner: bucket do state, fixture de rede, banco, segundo plan sem mudanças
# e smoke. Chamado pelo CI (PRs, com destroy no fim) e pelo CD (fallback da main com CLOUD_PROVIDER=localstack).
# O ambiente nasce e morre com o job.
name: LocalStack efêmero

on:
  workflow_call:
    inputs:
      destroy:
        description: 'Roda o destroy do banco e da fixture no fim (prova que o destroy é limpo).'
        type: boolean
        default: true
      comment_plan:
        description: 'Comenta o plan no PR (exige pull-requests: write no chamador).'
        type: boolean
        default: false
    secrets:
      LOCALSTACK_AUTH_TOKEN:
        required: true

# Sem bloco permissions: o workflow chamado herda as do chamador (o CI concede pull-requests: write
# para o comentário do plan; o CD só contents: read). Pedir mais que o chamador faz o job falhar.

env:
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_VAR_cloud_provider: localstack
  TF_VAR_environment: prod
  BACKEND: backend/localstack.s3.tfbackend
  FIXTURE_DIR: tests/network-fixture

jobs:
  ephemeral:
    name: ephemeral
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Conferir o token do LocalStack
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          if [ -z "$LOCALSTACK_AUTH_TOKEN" ]; then
            echo "::error::Secret LOCALSTACK_AUTH_TOKEN ausente. O RDS exige o LocalStack Pro."
            exit 1
          fi

      - name: Subir o LocalStack
        # v0.3.2 (release imutável), fixada pelo SHA, como na esteira da aplicação.
        uses: LocalStack/setup-localstack@7c8a0cb3405bc58be4c8f763f812aa000bc46303
        with:
          image-tag: '2026.9.1'
          install-awslocal: 'true'
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          LS_WAIT_TIMEOUT: '180'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.16.4'
          terraform_wrapper: false

      - name: Bucket do state
        # No ambiente real, quem cria o bucket é o bootstrap do SOAT-Oficina-Infra-K8s (INFRA-8).
        run: |
          set -euo pipefail
          bucket=$(sed -n 's/^bucket *= *"\(.*\)"/\1/p' "$BACKEND")
          awslocal s3api head-bucket --bucket "$bucket" 2>/dev/null || awslocal s3 mb "s3://$bucket"

      - name: Fixture de rede
        run: |
          set -euo pipefail
          terraform -chdir="$FIXTURE_DIR" init -backend-config="../../$BACKEND" -backend-config="key=infra-k8s/terraform.tfstate"
          terraform -chdir="$FIXTURE_DIR" apply -auto-approve

      - name: Terraform init
        run: terraform init -backend-config="$BACKEND"

      - name: Terraform plan
        id: plan
        run: |
          set -euo pipefail
          terraform plan -out=tfplan -no-color | tee "$RUNNER_TEMP/plan.txt"

      - name: Comentar o plan no PR
        if: ${{ inputs.comment_plan && github.event_name == 'pull_request' }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- infra-db-plan -->';
            let plan = fs.readFileSync(`${process.env.RUNNER_TEMP}/plan.txt`, 'utf8');
            const limit = 60000;
            if (plan.length > limit) plan = '...(truncado)\n' + plan.slice(-limit);
            const summary = (plan.match(/Plan: .*|No changes\..*/) || ['(sem resumo)'])[0];
            const body = [
              marker,
              '### Terraform plan (LocalStack efêmero)',
              '',
              `**${summary}**`,
              '',
              'Plan contra o LocalStack do runner, sobre a fixture de rede. Valores sensíveis aparecem como `(sensitive value)`.',
              '',
              '<details><summary>Plan completo</summary>',
              '',
              '```',
              plan,
              '```',
              '</details>',
              '',
              `_Commit ${context.sha.slice(0, 7)}, execução [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})._`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const previous = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Terraform apply
        run: terraform apply tfplan

      - name: Segundo plan sem mudanças
        # -detailed-exitcode: 0 = sem mudanças, 2 = há mudanças (drift entre o código e o que o LocalStack devolve).
        run: |
          set -uo pipefail
          terraform plan -detailed-exitcode -no-color > "$RUNNER_TEMP/replan.txt"
          code=$?
          if [ "$code" -ne 0 ]; then
            cat "$RUNNER_TEMP/replan.txt"
            echo "::error::O segundo plan não está limpo (exit $code). Há drift ou erro."
            exit 1
          fi
          echo "Segundo plan: sem mudanças."

      - name: Smoke
        run: |
          set -euo pipefail
          name=$(terraform output -raw db_connection_string_parameter_name)
          type=$(awslocal ssm get-parameter --name "$name" --query Parameter.Type --output text)
          [ "$type" = "SecureString" ] || { echo "::error::Parâmetro $name com tipo $type."; exit 1; }
          echo "Parâmetro $name: $type"
          port=$(terraform output -raw db_port)
          for i in $(seq 1 30); do
            pg_isready -h localhost -p "$port" -t 5 && break
            sleep 5
          done
          pg_isready -h localhost -p "$port" -t 5
          {
            echo "### Banco no LocalStack"
            echo "- Parâmetro \`$name\`: \`$type\`"
            echo "- Postgres aceitando conexões na porta \`$port\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform destroy
        if: ${{ inputs.destroy }}
        run: |
          set -euo pipefail
          terraform destroy -auto-approve
          terraform -chdir="$FIXTURE_DIR" destroy -auto-approve

      - name: Logs do LocalStack
        if: failure()
        run: docker logs localstack-main 2>&1 | tail -300 || true
